<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L1 SOC Investigation &amp; Triage Practice</title>
<style>
  :root{
    --bg:#10161d;
    --panel:#161e27;
    --panel-2:#1b2530;
    --line:#28323d;
    --text:#e6ecf2;
    --muted:#8b98a8;
    --accent:#4f9dd6;
    --accent-dim:#2c4f68;
    --ok:#4f9d7d;
    --warn:#d99a4e;
    --high:#e2703a;
    --crit:#d1453b;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{padding:28px 16px 60px;}
  .shell{max-width:960px;margin:0 auto;}

  header.top{margin-bottom:18px;}
  .eyebrow{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:0 0 4px;}
  h1{font-size:21px;margin:0 0 4px;font-weight:600;letter-spacing:-0.01em;}
  .case-line{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .case-line .count{color:var(--muted);font-size:13px;font-family:var(--mono);}

  .ticks{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:22px;}
  .tick{width:16px;height:8px;border-radius:2px;background:var(--line);cursor:pointer;transition:transform .12s;}
  .tick:hover{transform:scaleY(1.4);}
  .tick.current{background:var(--accent);}
  .tick.answered{background:#3a4756;}
  .tick.correct{background:var(--ok);}
  .tick.incorrect{background:var(--crit);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:14px;}
  .panel h2{font-size:13px;margin:0 0 12px;color:var(--muted);font-weight:600;letter-spacing:.02em;}

  .meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 18px;}
  .meta-item{font-size:13px;}
  .meta-item .k{color:var(--muted);font-size:11px;display:block;}
  .meta-item .v{font-family:var(--mono);}
  .sev-badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-family:var(--mono);font-weight:600;}
  .sev-Low{background:#39424c;color:var(--text);}
  .sev-Medium{background:var(--warn);color:#20150a;}
  .sev-High{background:var(--high);color:#1a0a04;}
  .sev-Critical{background:var(--crit);color:#1a0505;}

  .titlebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px;}
  .scen-title{font-size:16px;font-weight:600;}

  pre.logblock{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.5;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0 0 10px;}
  pre.logblock:last-child{margin-bottom:0;}

  details.checklist{margin-top:2px;}
  details.checklist summary{cursor:pointer;color:var(--accent);font-size:13px;user-select:none;}
  details.checklist ul{margin:10px 0 0;padding-left:20px;font-size:13px;color:var(--text);line-height:1.6;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .field input[type=text], .field textarea, .field select{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;
    color:var(--text);font-family:var(--sans);font-size:13.5px;padding:8px 10px;
  }
  .field textarea{resize:vertical;min-height:52px;line-height:1.4;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 16px;}

  fieldset{border:1px solid var(--line);border-radius:5px;padding:10px 12px 12px;margin:0 0 14px;}
  fieldset legend{font-size:12px;color:var(--muted);padding:0 4px;}
  .opt-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:4px;}
  .opt-row label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);cursor:pointer;}
  .opt-row input{accent-color:var(--accent);}

  .btnrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .btnrow .left-group, .btnrow .right-group{display:flex;gap:8px;flex-wrap:wrap;}
  button{font-family:var(--sans);font-size:13.5px;padding:9px 16px;border-radius:4px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);cursor:pointer;}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#08131c;font-weight:600;}
  button.primary:hover{opacity:.92;}
  button:disabled{opacity:.4;cursor:default;}
  button:disabled:hover{border-color:var(--line);}

  .answerkey{margin-top:10px;padding:12px 14px;border-radius:5px;border:1px solid var(--line);background:var(--panel-2);font-size:13.5px;line-height:1.55;}
  .answerkey .verdict-line{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .pill{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:3px;background:#243040;}
  .pill.correct{background:var(--ok);color:#062017;}
  .pill.incorrect{background:var(--crit);color:#210606;}
  .pill.neutral{background:#3a4756;}

  .summary-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
  .summary-table th, .summary-table td{text-align:left;border-bottom:1px solid var(--line);padding:7px 8px;}
  .summary-table th{color:var(--muted);font-weight:500;font-size:12px;}

  .hint{font-size:12px;color:var(--muted);margin-top:2px;}

  /* registration */
  .gate{max-width:520px;margin:6vh auto 0;}
  .gate .lead{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 18px;}
  .gate .panel{padding:20px;}
  .req{color:var(--high);}
  .notice{font-size:12px;color:var(--muted);line-height:1.55;margin:12px 0 0;border-left:2px solid var(--accent-dim);padding-left:10px;}
  .err{color:var(--crit);font-size:12.5px;margin-top:8px;min-height:16px;}

  /* participant bar */
  .whoami{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px;}
  .whoami .name{color:var(--text);font-weight:600;}
  .whoami .sid{font-family:var(--mono);}

  /* score */
  .scorebox{display:flex;align-items:baseline;gap:12px;margin:2px 0 14px;}
  .scorebox .big{font-size:44px;font-weight:600;letter-spacing:-0.02em;line-height:1;}
  .scorebox .of{font-size:15px;color:var(--muted);}
  .submitstate{font-size:13px;margin-top:10px;line-height:1.5;}
  .submitstate.ok{color:var(--ok);}
  .submitstate.bad{color:var(--warn);}
  .locked-note{font-size:12px;color:var(--muted);margin-top:6px;}

  /* leaderboard */
  .stats{display:flex;gap:26px;flex-wrap:wrap;margin:0 0 16px;}
  .stat .n{font-size:26px;font-weight:600;line-height:1.1;}
  .stat .l{font-size:11px;color:var(--muted);}
  .lb{width:100%;border-collapse:collapse;font-size:13.5px;}
  .lb th,.lb td{text-align:left;padding:8px;border-bottom:1px solid var(--line);}
  .lb th{color:var(--muted);font-weight:500;font-size:11.5px;}
  .lb td.rank{font-family:var(--mono);color:var(--muted);width:38px;}
  .lb td.num{font-family:var(--mono);}
  .lb tr.you{background:rgba(79,157,214,.12);}
  .lb tr.you td.rank{color:var(--accent);}
  .lb tr.top td.rank{color:var(--text);font-weight:600;}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;min-width:70px;}
  .bar > span{display:block;height:100%;background:var(--accent);}
  .bar.hard > span{background:var(--high);}
  .empty{font-size:13.5px;color:var(--muted);line-height:1.6;}
  .lb-foot{font-size:11.5px;color:var(--muted);margin-top:12px;}
  .check-row{display:flex;gap:8px;align-items:flex-start;margin:2px 0 14px;font-size:13px;}
  .check-row input{margin-top:2px;accent-color:var(--accent);}
  .check-row label{line-height:1.45;cursor:pointer;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
  @media (max-width:600px){
    .meta-grid{grid-template-columns:1fr 1fr;}
    .grid2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="top" id="topHeader" style="display:none;">
    <p class="eyebrow">SOC L1 TRIAGE PRACTICE</p>
    <h1>Investigation &amp; Triage Walkthrough</h1>
    <div class="whoami" id="whoami"></div>
    <div class="case-line">
      <span class="count" id="caseCounter">Case 01 / 22</span>
      <span class="count" id="scoreCounter"></span>
    </div>
    <div class="ticks" id="ticks"></div>
  </header>

  <div id="registerView"></div>
  <div id="scenarioView" style="display:none;"></div>
  <div id="summaryView" style="display:none;"></div>
  <div id="leaderboardView" style="display:none;"></div>
</div>

<script>
const SUBMIT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxHRuVeyxLtCj6Lwrk8rLLFBBtSKKf1jsfc1KtcSitWMreTYFotwdbXiKp3whcb2I4/exec';
const SHOW_LEADERBOARD = true;
const SCENARIOS = [
{
  id:'ALT-2026-0001', title:'Failed Windows Logon',
  meta:{Ticket:'INC-2026-0001', Source:'Trend Micro / SIEM', Rule:'Multiple Windows Logon Failures', Severity:'Medium', Priority:'P3', Status:'Open', Asset:'XXX-ADMIN-01', User:'mis-admin', MITRE:'T1110 - Brute Force'},
  logs:[`LogType: detection
pname: Server & Workload Protection
endpointHostName: XXX-ADMIN-01
endpointIp: 10.6.120.1

winEventId: 4625
eventId: 100116
eventName: LOG_INSPECTION_EVENT
ruleName: Microsoft Windows Events

duser: xxxxdomain.xxx.xx/mis-admin
filePath: Security

Logon Type: 3
Status: 0xc000006d
Sub Status: 0xc0000064
Logon Process: NtLmSsp
Authentication Package: NTLM

subRuleName: ATTACK T1110: Multiple Windows Logon Failures
rt: 2026-06-11T16:36:50Z`],
  checklist:['How many 4625 events occurred, and over what time window?','Are the failures from one source IP or multiple sources?','Did a 4624 successful logon follow the failures?','Is mis-admin a legitimate administrative account for this host?','Is this during an expected maintenance window?','Are other hosts being targeted by the same source?'],
  answer:{verdict:'Inconclusive', escalate:'conditional', rationale:'A single 4625 event does not establish an attack on its own. Pull the full failure count and source diversity: many failures across accounts/hosts with no success \u2192 escalate as a suspected credential attack; one expected failure during known administration \u2192 benign positive; an isolated, unexplained failure \u2192 monitor rather than close outright.'}
},
{
  id:'ALT-2026-0002', title:'Encoded PowerShell',
  meta:{Ticket:'INC-2026-0002', Source:'SIEM / Sysmon / PowerShell', Rule:'Suspicious Encoded PowerShell', Severity:'High', Priority:'P2', Status:'Open', Asset:'FIN-WKS-0231', User:'j.delacruz', MITRE:'T1059.001'},
  logs:[`[Sysmon EventID 1]
Timestamp: 2026-07-10 08:14:00
Computer: FIN-WKS-0231
User: j.delacruz
Image: C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe
ParentImage: C:\\Program Files\\Microsoft Office\\root\\Office16\\OUTLOOK.EXE
CommandLine: powershell.exe -ExecutionPolicy Bypass -EncodedCommand <BASE64_DATA>
ProcessId: 4412
ParentProcessId: 3320`,
`[PowerShell EventID 4104]
Timestamp: 2026-07-10 08:15:12
Host: FIN-WKS-0231
User: j.delacruz
ScriptBlock: Base64-decoded command downloads remote payload
Destination: update-cdn-sync[.]com`],
  checklist:['Was Outlook recently processing an email?','What was the decoded PowerShell command?','What URL/domain was contacted?','Was a file created?','What is the downloaded file hash?','Did the process execute another child process?'],
  answer:{verdict:'True Positive', escalate:true, rationale:'Outlook spawning PowerShell with an encoded command and execution-policy bypass, resolving a remote download destination, is a well-formed initial-access-to-execution chain. Escalate to L2 for payload retrieval, hash lookup, and network-wide IOC sweep of update-cdn-sync[.]com.'}
},
{
  id:'ALT-2026-0003', title:'Malicious PowerShell / Network Activity',
  meta:{Source:'SIEM / Firewall', Rule:'Suspicious Outbound Connection', Severity:'High', Asset:'FIN-WKS-0231', Process:'powershell.exe', MITRE:'T1071.001'},
  logs:[`Timestamp: 2026-07-10 08:16:03
Source Host: FIN-WKS-0231
Source IP: 10.10.23.45
Destination IP: 185.220.x.x
Destination Port: 443
Protocol: TCP
Action: Allowed
Bytes Out: 18241
Bytes In: 94722
Application: powershell.exe`],
  checklist:['Was the connection created immediately after PowerShell execution?','Is the destination known or suspicious?','Was there DNS resolution before the connection?','Did the same destination appear on other hosts?'],
  answer:{verdict:'True Positive', escalate:true, rationale:'This connection correlates directly with the encoded-PowerShell alert on the same host seconds earlier. PowerShell + encoded command + an immediate outbound connection to an unresolved/suspicious IP is a strong compound True Positive indicator. Escalate to L2 alongside ALT-2026-0002.'}
},
{
  id:'ALT-2026-0004', title:'Windows Service Persistence',
  meta:{Source:'Windows Event Logs', Rule:'Suspicious Service Creation', Severity:'High', Asset:'XXX-ADMIN-01', User:'mis-admin', MITRE:'T1543.003'},
  logs:[`Event ID: 7045
Provider: Service Control Manager
Service Name: mXJLFJZH
Service File Name: %COMSPEC% /Q /c echo cd > \\\\%COMPUTERNAME%\\C$\\__output_fGSWJnuB 2>&1 > %SYSTEMROOT%\\kbMNhiIZ.bat & %COMSPEC% /Q /c %SYSTEMROOT%\\kbMNhiIZ.bat & del %SYSTEMROOT%\\kbMNhiIZ.bat
Service Type: User mode service
Start Type: Demand Start
Service Account: LocalSystem
Timestamp: 2026-06-11 16:40:51 UTC`],
  checklist:['Who created the service?','What process created it?','Does kbMNhiIZ.bat exist?','Is the file malicious?','Was there preceding authentication activity?','Was SMB/remote execution involved?'],
  answer:{verdict:'True Positive', escalate:true, rationale:'A random service name, %COMSPEC% invocation, a temp .bat file, the C$ administrative share, and LocalSystem context together are a textbook remote-service-creation persistence pattern. Escalate to L2 and correlate with Scenarios 05/06.'}
},
{
  id:'ALT-2026-0005', title:'Malware Detection (NetExec/Smbexec)',
  meta:{Source:'Trend Micro', Rule:'Malware Behavior', Severity:'High', Asset:'XXX-ADMIN-01', MITRE:'T1059.003 / T1021', Action:'Terminated'},
  logs:[`eventId: 100100
eventName: MALWARE_DETECTION
objectFilePath: C:\\Windows\\System32\\cmd.exe
processName: C:\\Windows\\System32\\cmd.exe
behaviorCat: Threat-Detection
majorVirusType: Suspicious Activity
Detection: NetExec Remote Execution via Smbexec
Action: Terminated
filterRiskLevel: high
Timestamp: 2026-06-11T16:39:28Z`],
  checklist:['What launched cmd.exe?','What command line was executed?','Was this remote execution?','Which account initiated it?','What source host connected?','Did the same activity occur elsewhere?'],
  answer:{verdict:'True Positive', escalate:true, rationale:'"Action: Terminated" is not a closing verdict on its own. NetExec/Smbexec is a known lateral-movement/remote-execution tool signature, and it lines up with the service-creation and .bat artifacts in Scenarios 04/06 on the same host. Escalate to L2.'}
},
{
  id:'ALT-2026-0006', title:'Unrecognized File Execution',
  meta:{Source:'Trend Micro Application Control', Rule:'Unrecognized Software', Severity:'Medium', Asset:'XXX-ADMIN-01'},
  logs:[`eventId: 100111
eventName: APPLICATION_CONTROL_VIOLATION
objectFilePath: C:\\Windows\\kbMNhiIZ.bat
category: Execution of Unrecognized Software Allowed
act: Allowed
objectFileSize: 50
processName: C:\\Windows\\System32\\cmd.exe
processPid: 5192
processUser: NT AUTHORITY\\SYSTEM
SHA256: 6C7A8A878691EB8C94B0A6D46B31E8EB9EE502D6ADA6DF3A46225F7498D916F4
Timestamp: 2026-06-11T16:40:48Z`],
  checklist:['Does this correlate with the Scenario 04 service creation (same .bat filename)?','Does it correlate with the Scenario 05 malware detection (same host, cmd.exe)?','Is the SHA256 known in threat intel?','Was the file deleted after execution (per the Scenario 04 service command)?'],
  answer:{verdict:'True Positive', escalate:true, rationale:'Same filename (kbMNhiIZ.bat), same host, SYSTEM context, immediately following the 7045 service creation \u2014 this is one persistence/remote-execution chain, not three separate low-value alerts. Escalate to L2 as a single correlated case with 04 and 05.'}
},
{
  id:'ALT-2026-0007', title:'SentinelOne Malware Detection',
  meta:{Source:'SentinelOne Singularity', Rule:'File Threat', Severity:'Medium', Asset:'INTRANET2', User:'IP 10.30.0.11', Status:'Cleared', MITRE:'-'},
  logs:[`metadata.event_type: FILE_UNCATEGORIZED
metadata.vendor_name: SentinelOne
principal.hostname: INTRANET2
principal.ip: 10.30.0.11
target.file.full_path: \\Device\\HarddiskVolume2\\etc\\Ladon12\\Ladon12\\CS\\res\\EdgePwd.dat
target.file.sha256: f7c72112f0b78ba061c46703f83a481d8acee67fbcaf9290c967de5769f2fc1f
target.file.size: 319488
target.file.exif_info.original_file: BrowserGhost.exe
security_result.threat_name: EdgePwd.dat
security_result.severity: MEDIUM
security_result.confidence: HIGH_CONFIDENCE
security_result.action: BLOCK
mitigation_status: success`],
  checklist:['Was the file executed?','Where did it come from?','Was BrowserGhost.exe present?','Is the hash seen on other systems?','Was quarantine successful?','Is there suspicious process activity before/after detection?'],
  answer:{verdict:'True Positive', escalate:'conditional', rationale:'A file masquerading as "BrowserGhost.exe" but detected as a credential-harvesting artifact (EdgePwd.dat), with high-confidence blocking, is a confirmed malicious file event with successful mitigation. Escalate further only if execution or broader compromise is suspected; otherwise log as contained.'}
},
{
  id:'ALT-2026-0008', title:'Malicious DNS Query',
  meta:{Source:'Trend Vision One XDR', Rule:'Malicious DNS Communication', Severity:'High', Asset:'AG-DICT-ACER', Process:'AmanOnlineWT.exe', MITRE:'T1071.004'},
  logs:[`endpointHostName: AG-DICT-ACER
Process: AmanOnlineWT.exe
SHA256: 991af8735e8b4be3018277bdacb1241a46f4b6032d76a2f97b551b96b87da43b
eventId: 4
Activity: DNS Query
Observed: AmanOnlineWT.exe contacting malicious domains
Domains:
10.17ce.holadns.com
10.17ce.martianinc.co
10.17ce.okamiboss.com`],
  checklist:['Did AmanOnlineWT.exe also make network connections?','Which IP addresses resolved from the domains?','When was the first DNS query?','Which users/hosts contacted these domains?','Is the domain known malicious?'],
  answer:{verdict:'True Positive', escalate:true, rationale:'An unfamiliar process making DNS queries to multiple flagged-malicious domains is a strong indicator of C2 or adware/PUP activity. Escalate and expand scope to check for the same process/domains on other hosts.'}
},
{
  id:'ALT-2026-0009', title:'Malicious Outbound Network Connection',
  meta:{Source:'Trend Vision One XDR', Rule:'Suspicious Network Activity', Severity:'High', Asset:'AG-DICT-ACER', Process:'AmanOnlineWT.exe', MITRE:'T1095'},
  logs:[`endpointHostName: AG-DICT-ACER
Process: AmanOnlineWT.exe
eventId: 3
Activity: Outbound Connection
Destination: 46.165.199.9

--- second event ---
eventId: 3
Process: AmanOnlineWT.exe
Outbound Connection: 178.162.202.97

--- observation ---
Multiple Network Outbound Connections to malicious IPs`],
  checklist:['Does this correlate with the DNS queries in Scenario 08?','Are 46.165.199.9 and 178.162.202.97 associated with known malicious infrastructure?','Is this the same process/host as Scenario 08?'],
  answer:{verdict:'True Positive', escalate:true, rationale:'Same process and host as the malicious DNS activity in Scenario 08, now followed by connections to multiple malicious IPs. Escalate to L2 and begin an environment-wide IOC sweep for this process hash and these destinations.'}
},
{
  id:'ALT-2026-0010', title:'Reconnaissance / Horizontal Scanning',
  meta:{Source:'SIEM / Network Detection', Rule:'Internal Reconnaissance', Severity:'Medium', Asset:'LTO environment', Status:'Open', MITRE:'Discovery'},
  logs:[`Alert: Internal Reconnaissance / Horizontal Scanning Detected
Ports: 135, 139, 445 (TCP)
Activity: Multiple internal hosts contacted across SMB/RPC-related ports
Alert Count: 13
Timestamp: 2026-08-18 13:05:56`],
  checklist:['What source host initiated the scans?','Is the source host an approved scanner?','How many destination hosts were contacted?','Did successful connections occur?','Did authentication events follow?','Is there known vulnerability-scanning activity scheduled?'],
  answer:{verdict:'Inconclusive', escalate:'conditional', rationale:'SMB/RPC scanning across multiple hosts is consistent with both an approved vulnerability scanner and early-stage lateral-movement reconnaissance. Check the source host against the approved scanner list first: approved scanner \u2192 benign positive; unknown workstation with no scanning mandate \u2192 escalate as suspicious.'}
},
{
  id:'ALT-2026-0011', title:'Suspicious VPN Connection',
  meta:{Source:'Firewall / VPN', Rule:'Suspicious VPN Connection', Severity:'High', User:'RCPADERES', Status:'Open'},
  logs:[`User: RCPADERES
Source Host: 10.237.0.210
Destination Host: 10.238.4.12
Destination Port: 10443
Activity: VPN Connection
Timestamp: 2026-08-18 12:53:56`],
  checklist:['Is the user authorized for VPN?','Is the source IP expected?','Was MFA successful?','Is the login location normal?','Was there a prior failed authentication?','What activity occurred after the VPN connection?'],
  answer:{verdict:'Inconclusive', escalate:'conditional', rationale:'The metadata alone does not establish whether this connection is authorized. Confirm the user\u2019s VPN authorization, MFA status, and source-IP baseline before deciding between benign positive and a suspected compromised-credential escalation.'}
},
{
  id:'ALT-2026-0012', title:'Hidden PowerShell with Unusual Parent',
  meta:{Source:'SIEM / XDR', Rule:'Hidden PowerShell with Unusual Parent', Severity:'High', User:'ADMIN', Asset:'DESKTOP-9610LSF', MITRE:'Execution / Defense Evasion'},
  logs:[`Host: DESKTOP-9610LSF
User: ADMIN
Process: powershell.exe
Window: Hidden
Parent Process: Unusual / Non-standard Parent
Execution: PowerShell launched with hidden window
Detection: Endpoint - Hidden Powershell with Unusual Parent
Timestamp: 2026-08-18 10:57:10`],
  checklist:['What is the parent process, specifically?','What is the full command line?','Is there an EncodedCommand or ExecutionPolicy bypass?','Was there network activity or file creation afterward?','What browser/email activity preceded execution?'],
  answer:{verdict:'Inconclusive', escalate:'conditional', rationale:'A hidden PowerShell window with an unusual parent is a defense-evasion signal, but is not enough on its own to call True Positive \u2014 many legitimate admin tools launch PowerShell this way. Pull the command line and correlate with network/file activity before deciding; escalate only if it combines with an encoded command, a download, or an unknown file.'}
},
{
  id:'ALT-2026-0013', title:'Kerberoasting',
  meta:{Ticket:'INC-2026-0013', Source:'Google SecOps (Chronicle)', Rule:'High Volume Kerberos Ticket Requests (RC4)', Severity:'High', Priority:'P2', Asset:'DC-PH-02', User:'svc-reporting', MITRE:'T1558.003'},
  logs:[`[Windows Event ID 4769]
Account Name: svc-reporting
Account Domain: XXXDOMAIN
Service Name: MSSQLSvc/db-fin-01.xxxdomain.local:1433
Client Address: ::ffff:10.12.4.87
Ticket Encryption Type: 0x17 (RC4-HMAC)

   CONFIG — edit these two values, nothing else.
   --------------------------------------------------------------------------
   SUBMIT_ENDPOINT : paste the Google Apps Script web app URL here (see
                     SETUP_scoreboard.md). Leave it as '' to run the page in
                     offline mode: participants still see their own score and
                     can download a report, but nothing is sent to you.
   SHOW_LEADERBOARD: set to false to hide the public board entirely.

const SUBMIT_ENDPOINT = '';
const SHOW_LEADERBOARD = true;

const VERDICTS = ['False Positive','Benign Positive','True Positive','Inconclusive'];
const responses = {};
let idx = 0;
let participant = null;   // {sessionId, name, email, team, displayName, listPublicly, startedAt}
let submitState = {status:'idle', message:''};
let board = {status:'idle', data:null, error:''};  // public leaderboard cache
let cameFrom = 'register';                          // where "Back" returns to

/* ---- storage: localStorage when available, memory otherwise ---- */
const memStore = {};
const store = {
  get(k){
    try { const v = localStorage.getItem(k); return v === null ? (k in memStore ? memStore[k] : null) : v; }
    catch(e){ return (k in memStore) ? memStore[k] : null; }
  },
  set(k,v){
    memStore[k] = v;
    try { localStorage.setItem(k,v); } catch(e){ /* private mode / sandbox */ }
  },
  del(k){
    delete memStore[k];
    try { localStorage.removeItem(k); } catch(e){}
  }
};

const ACTIVE_KEY = 'l1triage.active';
function stateKey(sid){ return 'l1triage.session.' + sid; }

function makeSessionId(){
  const d = new Date();
  const stamp = d.getFullYear().toString()
    + String(d.getMonth()+1).padStart(2,'0')
    + String(d.getDate()).padStart(2,'0')
    + '-' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0');
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return 'L1-' + stamp + '-' + rand;
}

function persist(){
  if(!participant) return;
  const payload = {participant:participant, responses:responses, idx:idx, submitted:submitState.status==='sent'};
  store.set(stateKey(participant.sessionId), JSON.stringify(payload));
  store.set(ACTIVE_KEY, participant.sessionId);
}

function restore(){
  const sid = store.get(ACTIVE_KEY);
  if(!sid) return false;
  const raw = store.get(stateKey(sid));
  if(!raw) return false;
  try{
    const data = JSON.parse(raw);
    if(!data.participant || !data.participant.name) return false;
    participant = data.participant;
    Object.keys(data.responses||{}).forEach(k=>{ responses[k] = data.responses[k]; });
    idx = typeof data.idx === 'number' ? data.idx : 0;
    if(data.submitted) submitState = {status:'sent', message:'Results already submitted for this session.'};
    return true;
  } catch(e){ return false; }
}

function ensureResp(id){
  if(!responses[id]) responses[id] = {host:'',user:'',process:'',parentProcess:'',cmdline:'',srcip:'',dstip:'',dstport:'',whatHappened:'',evidence:'',related:'',ioc:'',benignExplain:'',verdict:'',severityAssess:'',escalate:'',reason:'',nextAction:'',checked:false,correct:null};
  return responses[id];
}

function sevClass(sev){
  return 'sev-' + (sev||'Medium').replace(/[^A-Za-z]/g,'');
}

function el(tag, cls){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  return e;
}

function renderTicks(){
  const wrap = document.getElementById('ticks');
  wrap.innerHTML = '';
  SCENARIOS.forEach((s,i)=>{
    const t = el('div','tick');
    const r = responses[s.id];
    if(r && r.checked){ t.classList.add(r.correct ? 'correct' : 'incorrect'); }
    else if(r && r.verdict){ t.classList.add('answered'); }
    if(i===idx) t.classList.add('current');
    t.title = s.title;
    t.addEventListener('click', ()=>{ saveCurrent(); idx=i; render(); });
    wrap.appendChild(t);
  });
}

function saveCurrent(){
  if(document.getElementById('summaryView').style.display !== 'none') return;
  const s = SCENARIOS[idx];
  const r = ensureResp(s.id);
  const g = id => document.getElementById(id);
  ['host','user','process','parentProcess','cmdline','srcip','dstip','dstport','whatHappened','evidence','related','ioc','benignExplain','severityAssess','reason','nextAction'].forEach(f=>{
    const node = g(f);
    if(node) r[f] = node.value;
  });
  const vChecked = document.querySelector('input[name="verdict"]:checked');
  r.verdict = vChecked ? vChecked.value : r.verdict;
  const eChecked = document.querySelector('input[name="escalate"]:checked');
  r.escalate = eChecked ? eChecked.value : r.escalate;
  persist();
}

function buildField(labelText, id, type, value){
  const wrap = el('div','field');
  const label = el('label'); label.setAttribute('for',id); label.textContent = labelText;
  wrap.appendChild(label);
  let input;
  if(type==='textarea'){ input = el('textarea'); }
  else { input = el('input'); input.type='text'; }
  input.id = id; input.value = value||'';
  input.addEventListener('input', ()=>{ /* saved on nav */ });
  wrap.appendChild(input);
  return wrap;
}

function renderScenario(){
  document.getElementById('summaryView').style.display = 'none';
  document.getElementById('scenarioView').style.display = 'block';
  const s = SCENARIOS[idx];
  const r = ensureResp(s.id);
  document.getElementById('caseCounter').textContent = 'Case ' + String(idx+1).padStart(2,'0') + ' / ' + SCENARIOS.length;
  const checkedCount = Object.values(responses).filter(x=>x.checked).length;
  const correctCount = Object.values(responses).filter(x=>x.checked && x.correct).length;
  document.getElementById('scoreCounter').textContent = checkedCount ? ('Checked ' + checkedCount + ' \u00b7 ' + correctCount + ' correct') : '';
  renderTicks();

  const view = document.getElementById('scenarioView');
  view.innerHTML = '';

  // Evidence panel
  const evPanel = el('div','panel');
  const tbar = el('div','titlebar');
  const titleEl = el('div','scen-title'); titleEl.textContent = s.id + ' \u2014 ' + s.title;
  const badge = el('span','sev-badge ' + sevClass(s.meta.Severity)); badge.textContent = s.meta.Severity || '';
  tbar.appendChild(titleEl); tbar.appendChild(badge);
  evPanel.appendChild(tbar);

  const metaGrid = el('div','meta-grid');
  Object.keys(s.meta).forEach(k=>{
    if(k==='Severity') return;
    const item = el('div','meta-item');
    const kEl = el('span','k'); kEl.textContent = k;
    const vEl = el('span','v'); vEl.textContent = s.meta[k];
    item.appendChild(kEl); item.appendChild(vEl);
    metaGrid.appendChild(item);
  });
  evPanel.appendChild(metaGrid);
  view.appendChild(evPanel);

  // Raw log panel
  const logPanel = el('div','panel');
  const logH = el('h2'); logH.textContent = 'RAW LOG';
  logPanel.appendChild(logH);
  s.logs.forEach(txt=>{
    const pre = el('pre','logblock');
    pre.textContent = txt;
    logPanel.appendChild(pre);
  });
  const details = document.createElement('details'); details.className='checklist';
  const summary = document.createElement('summary'); summary.textContent = 'Investigative checklist (expand for guidance)';
  details.appendChild(summary);
  const ul = el('ul');
  s.checklist.forEach(q=>{ const li=document.createElement('li'); li.textContent=q; ul.appendChild(li); });
  details.appendChild(ul);
  logPanel.appendChild(details);
  view.appendChild(logPanel);

  // Form panel
  const formPanel = el('div','panel');
  const formH = el('h2'); formH.textContent = 'YOUR TRIAGE';
  formPanel.appendChild(formH);

  const grid2 = el('div','grid2');
  [['Host','host'],['User','user'],['Process','process'],['Parent Process','parentProcess'],
   ['Source IP','srcip'],['Destination IP','dstip'],['Destination Port','dstport']].forEach(([lbl,id])=>{
    grid2.appendChild(buildField(lbl,id,'text',r[id]));
  });
  formPanel.appendChild(grid2);
  formPanel.appendChild(buildField('Command Line','cmdline','textarea',r.cmdline));
  formPanel.appendChild(buildField('What happened?','whatHappened','textarea',r.whatHappened));
  formPanel.appendChild(buildField('Evidence reviewed','evidence','textarea',r.evidence));
  formPanel.appendChild(buildField('Related events','related','textarea',r.related));
  formPanel.appendChild(buildField('IOC findings','ioc','textarea',r.ioc));
  formPanel.appendChild(buildField('Expected / benign explanation (if any)','benignExplain','textarea',r.benignExplain));

  // Verdict fieldset
  const vfs = el('fieldset');
  const vleg = el('legend'); vleg.textContent = 'L1 Verdict';
  vfs.appendChild(vleg);
  const vrow = el('div','opt-row');
  VERDICTS.forEach(v=>{
    const lbl = el('label');
    const inp = el('input'); inp.type='radio'; inp.name='verdict'; inp.value=v;
    if(r.verdict===v) inp.checked = true;
    if(r.checked) inp.disabled = true;
    lbl.appendChild(inp);
    lbl.appendChild(document.createTextNode(v));
    vrow.appendChild(lbl);
  });
  vfs.appendChild(vrow);
  if(r.checked){
    const ln = el('div','locked-note');
    ln.textContent = 'Verdict locked \u2014 this case has been scored.';
    vfs.appendChild(ln);
  }
  formPanel.appendChild(vfs);

  // Severity + escalation row
  const grid2b = el('div','grid2');
  const sevField = el('div','field');
  const sevLabel = el('label'); sevLabel.textContent='Severity assessment';
  const sevSelect = el('select'); sevSelect.id='severityAssess';
  ['','Low','Medium','High','Critical'].forEach(opt=>{
    const o = document.createElement('option'); o.value=opt; o.textContent = opt || 'Select severity';
    if(r.severityAssess===opt) o.selected = true;
    sevSelect.appendChild(o);
  });
  sevField.appendChild(sevLabel); sevField.appendChild(sevSelect);
  grid2b.appendChild(sevField);

  const efs = el('fieldset');
  const eleg = el('legend'); eleg.textContent='Escalation Required';
  efs.appendChild(eleg);
  const erow = el('div','opt-row');
  ['No','Yes'].forEach(v=>{
    const lbl = el('label');
    const inp = el('input'); inp.type='radio'; inp.name='escalate'; inp.value=v;
    if(r.escalate===v) inp.checked = true;
    if(r.checked) inp.disabled = true;
    lbl.appendChild(inp);
    lbl.appendChild(document.createTextNode(v));
    erow.appendChild(lbl);
  });
  efs.appendChild(erow);
  grid2b.appendChild(efs);
  formPanel.appendChild(grid2b);

  formPanel.appendChild(buildField('Reason','reason','textarea',r.reason));
  formPanel.appendChild(buildField('Recommended next action','nextAction','textarea',r.nextAction));

  // Answer key reveal area
  const akWrap = el('div');
  akWrap.id = 'answerArea';
  if(r.checked){ akWrap.appendChild(buildAnswerKey(s,r)); }
  formPanel.appendChild(akWrap);

  // Buttons
  const btnrow = el('div','btnrow');
  const leftGroup = el('div','left-group');
  const prevBtn = el('button'); prevBtn.textContent='\u2190 Previous'; prevBtn.disabled = idx===0;
  prevBtn.addEventListener('click', ()=>{ saveCurrent(); idx=Math.max(0,idx-1); render(); });
  leftGroup.appendChild(prevBtn);

  if(!r.checked){
    const checkBtn = el('button','primary'); checkBtn.textContent='Check answer & score';
    checkBtn.addEventListener('click', ()=>{
      saveCurrent();
      const rr = ensureResp(s.id);
      if(!rr.verdict){ alert('Pick a verdict first, then check your answer.'); return; }

      rr.correct = computeCorrect(s.answer, rr);
      persist();
      render();
    });
    leftGroup.appendChild(checkBtn);
  }
  btnrow.appendChild(leftGroup);

  const rightGroup = el('div','right-group');
  const nextBtn = el('button','primary');
  nextBtn.textContent = idx === SCENARIOS.length-1 ? 'Finish \u2192' : 'Next \u2192';
  nextBtn.addEventListener('click', ()=>{
    saveCurrent();
    if(idx === SCENARIOS.length-1){ renderSummary(); }
    else { idx++; render(); }
  });
  rightGroup.appendChild(nextBtn);
  btnrow.appendChild(rightGroup);

  formPanel.appendChild(btnrow);
  view.appendChild(formPanel);
}

function computeCorrect(answer, r){
  if(answer.verdict !== r.verdict) return false;
  if(answer.escalate === 'conditional') return true;
  const expectedEsc = answer.escalate ? 'Yes' : 'No';
  return r.escalate === expectedEsc;
}

function buildAnswerKey(s,r){
  const box = el('div','answerkey');
  const line = el('div','verdict-line');
  const p1 = el('span','pill neutral'); p1.textContent = 'Expected: ' + s.answer.verdict;
  line.appendChild(p1);
  const escText = s.answer.escalate === 'conditional' ? 'Escalation: depends (see rationale)' : ('Escalation: ' + (s.answer.escalate ? 'Yes' : 'No'));
  const p2 = el('span','pill neutral'); p2.textContent = escText;
  line.appendChild(p2);
  const p3 = el('span','pill ' + (r.correct ? 'correct' : 'incorrect'));
  p3.textContent = r.correct ? 'Your verdict matched' : 'Your verdict differed';
  line.appendChild(p3);
  box.appendChild(line);
  const rat = el('div'); rat.textContent = s.answer.rationale;
  box.appendChild(rat);
  return box;
}

function buildPayload(){
  const checked = Object.values(responses).filter(x=>x.checked);
  const correct = checked.filter(x=>x.correct).length;
  const finishedAt = new Date().toISOString();
  const started = participant.startedAt ? new Date(participant.startedAt) : null;
  const minutes = started ? Math.round((new Date(finishedAt) - started)/60000) : null;
  return {
    sessionId: participant.sessionId,
    name: participant.name,
    email: participant.email || '',
    team: '',
    displayName: participant.displayName || participant.name,
    listPublicly: !!participant.listPublicly,
    startedAt: participant.startedAt,
    finishedAt: finishedAt,
    durationMinutes: minutes,
    totalCases: SCENARIOS.length,
    scoredCases: checked.length,
    correct: correct,
    scorePercent: Math.round((correct/SCENARIOS.length)*100),
    userAgent: navigator.userAgent,
    cases: SCENARIOS.map(s=>{
      const r = responses[s.id] || {};
      return {
        id: s.id,
        title: s.title,
        verdict: r.verdict || '',
        expected: s.answer.verdict,
        escalate: r.escalate || '',
        severity: r.severityAssess || '',
        scored: !!r.checked,
        correct: r.checked ? !!r.correct : null,
        whatHappened: r.whatHappened || '',
        reason: r.reason || '',
        nextAction: r.nextAction || ''
      };
    })
  };
}

async function submitResults(){
  if(!SUBMIT_ENDPOINT || !participant) return;
  submitState = {status:'sending', message:'Sending your results\u2026'};
  renderSummary();
  try{
    const res = await fetch(SUBMIT_ENDPOINT, {
      method:'POST',
      // text/plain keeps this a "simple" request, so the browser skips the
      // CORS preflight that Apps Script web apps cannot answer.
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(buildPayload())
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    submitState = {status:'sent', message:'Results submitted. Your session ID is ' + participant.sessionId + ' \u2014 quote it if you need your score looked up.'};
    persist();
    if(SHOW_LEADERBOARD){ board = {status:'idle', data:null, error:''}; }
  } catch(err){
    submitState = {status:'error', message:'Could not send results (' + err.message + '). Download your report and send it to the training administrator instead.'};
  }
  renderSummary();
}

function exportReport(){
  const checked = Object.values(responses).filter(x=>x.checked);
  const correct = checked.filter(x=>x.correct).length;
  let out = 'L1 SOC INVESTIGATION & TRIAGE PRACTICE - EXPORTED REPORT\n';
  out += 'Generated: ' + new Date().toISOString() + '\n';
  if(participant){
    out += 'Username: ' + participant.name + '\n';
    out += 'Email: ' + (participant.email||'') + '\n';
    out += 'Session ID: ' + participant.sessionId + '\n';
    out += 'Started: ' + participant.startedAt + '\n';
  }
  out += 'Score: ' + correct + '/' + SCENARIOS.length + ' (' + Math.round((correct/SCENARIOS.length)*100) + '%), ' + checked.length + ' cases scored\n';
  out += '='.repeat(60) + '\n\n';
  SCENARIOS.forEach(s=>{
    const r = responses[s.id] || {};
    out += s.id + ' - ' + s.title + '\n';
    out += '-'.repeat(60) + '\n';
    out += 'Host: ' + (r.host||'') + '\n';
    out += 'User: ' + (r.user||'') + '\n';
    out += 'Process: ' + (r.process||'') + '\n';
    out += 'Parent Process: ' + (r.parentProcess||'') + '\n';
    out += 'Command Line: ' + (r.cmdline||'') + '\n';
    out += 'Source IP: ' + (r.srcip||'') + '\n';
    out += 'Destination IP: ' + (r.dstip||'') + '\n';
    out += 'Destination Port: ' + (r.dstport||'') + '\n\n';
    out += 'What happened?\n' + (r.whatHappened||'') + '\n\n';
    out += 'Evidence reviewed:\n' + (r.evidence||'') + '\n\n';
    out += 'Related events:\n' + (r.related||'') + '\n\n';
    out += 'IOC findings:\n' + (r.ioc||'') + '\n\n';
    out += 'Expected/benign explanation:\n' + (r.benignExplain||'') + '\n\n';
    out += 'L1 Verdict: ' + (r.verdict||'(none)') + '\n';
    out += 'Severity assessment: ' + (r.severityAssess||'') + '\n';
    out += 'Escalation Required: ' + (r.escalate||'') + '\n';
    out += 'Reason: ' + (r.reason||'') + '\n';
    out += 'Recommended Next Action: ' + (r.nextAction||'') + '\n\n';
    if(r.checked){
      out += 'Expected classification: ' + s.answer.verdict + '\n';
      out += 'Result: ' + (r.correct ? 'Matched' : 'Differed') + '\n';
    }
    out += '\n' + '='.repeat(60) + '\n\n';
  });
  const blob = new Blob([out], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'l1-triage-' + (participant ? participant.sessionId : 'report') + '.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function beginSession(){
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const errEl = document.getElementById('regError');
  if(name.length < 2){
    errEl.textContent = 'Enter a username to continue.';
    document.getElementById('regName').focus(); return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    errEl.textContent = 'Enter a valid email address.';
    document.getElementById('regEmail').focus(); return;
  }
  errEl.textContent = '';
  const pubNode = document.getElementById('regPublic');
  participant = {
    sessionId: makeSessionId(),
    name: name,
    email: email,
    displayName: name,
    listPublicly: pubNode ? pubNode.checked : false,
    startedAt: new Date().toISOString()
  };
  idx = 0;
  persist();
  render();
}

/* ======================= PUBLIC LEADERBOARD ======================= */

function loadLeaderboard(force){
  if(!SUBMIT_ENDPOINT || !SHOW_LEADERBOARD) return;
  if(board.status === 'loading') return;
  if(board.status === 'ready' && !force) return;
  board = {status:'loading', data:null, error:''};
  renderLeaderboard();

  const url = SUBMIT_ENDPOINT + (SUBMIT_ENDPOINT.indexOf('?') > -1 ? '&' : '?') + 'mode=leaderboard&t=' + Date.now();

  fetch(url)
    .then(res => { if(!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(data => { board = {status:'ready', data:data, error:''}; renderLeaderboard(); })
    .catch(() => jsonpLeaderboard(url));   // Apps Script + CORS fallback
}

/* Apps Script sometimes refuses cross-origin fetch; JSONP always works. */
function jsonpLeaderboard(url){
  const cbName = 'lbcb_' + Math.random().toString(36).slice(2,8);
  const script = document.createElement('script');
  const done = (data)=>{
    delete window[cbName];
    if(script.parentNode) script.parentNode.removeChild(script);
    if(data){ board = {status:'ready', data:data, error:''}; }
    else { board = {status:'error', data:null, error:'Could not load the leaderboard right now.'}; }
    renderLeaderboard();
  };
  window[cbName] = done;
  script.src = url + '&callback=' + cbName;
  script.onerror = ()=> done(null);
  document.body.appendChild(script);
  setTimeout(()=>{ if(window[cbName]) done(null); }, 12000);
}

function fmtMinutes(m){
  if(m === null || m === undefined || m === '') return '\u2014';
  return m < 60 ? (m + 'm') : (Math.floor(m/60) + 'h ' + (m%60) + 'm');
}

function renderLeaderboard(){
  document.getElementById('registerView').style.display = 'none';
  document.getElementById('scenarioView').style.display = 'none';
  document.getElementById('summaryView').style.display = 'none';
  document.getElementById('topHeader').style.display = participant ? 'block' : 'none';
  const view = document.getElementById('leaderboardView');
  view.style.display = 'block';
  view.innerHTML = '';

  const panel = el('div','panel');
  const h = el('h2'); h.textContent = 'LEADERBOARD';
  panel.appendChild(h);

  if(board.status === 'loading'){
    const p = el('p','empty'); p.textContent = 'Loading scores\u2026';
    panel.appendChild(p);
  } else if(board.status === 'error'){
    const p = el('p','empty'); p.textContent = board.error;
    panel.appendChild(p);
  } else if(board.status === 'ready'){
    const d = board.data || {};
    const entries = d.entries || [];

    const stats = el('div','stats');
    [[d.participants || 0,'analysts completed'],
     [(d.averagePercent || 0) + '%','average score'],
     [entries.length ? (entries[0].score + '/' + entries[0].total) : '\u2014','top score']
    ].forEach(([n,l])=>{
      const s = el('div','stat');
      const nn = el('div','n'); nn.textContent = n;
      const ll = el('div','l'); ll.textContent = l;
      s.appendChild(nn); s.appendChild(ll); stats.appendChild(s);
    });
    panel.appendChild(stats);

    if(!entries.length){
      const p = el('p','empty');
      p.textContent = 'No scores posted yet. Finish the practice and submit your results to open the board.';
      panel.appendChild(p);
    } else {
      const table = el('table','lb');
      const thead = document.createElement('thead');
      const hr = document.createElement('tr');
      ['#','Analyst','Score','Accuracy','Time'].forEach(t=>{
        const th = document.createElement('th'); th.textContent = t; hr.appendChild(th);
      });
      thead.appendChild(hr); table.appendChild(thead);
      const tb = document.createElement('tbody');
      entries.forEach(en=>{
        const tr = document.createElement('tr');
        if(participant && en.sessionId === participant.sessionId) tr.classList.add('you');
        if(en.rank <= 3) tr.classList.add('top');
        const c1 = document.createElement('td'); c1.className='rank'; c1.textContent = en.rank;
        const c2 = document.createElement('td');
        c2.textContent = en.name + ((participant && en.sessionId === participant.sessionId) ? '  (you)' : '');
        const c4 = document.createElement('td'); c4.className='num'; c4.textContent = en.score + '/' + en.total;
        const c5 = document.createElement('td');
        const bar = el('div','bar'); const fill = document.createElement('span');
        fill.style.width = Math.max(2, en.percent) + '%'; bar.appendChild(fill);
        c5.appendChild(bar);
        const c6 = document.createElement('td'); c6.className='num'; c6.textContent = fmtMinutes(en.minutes);
        [c1,c2,c4,c5,c6].forEach(c=>tr.appendChild(c));
        tb.appendChild(tr);
      });
      table.appendChild(tb);
      panel.appendChild(table);

      const foot = el('p','lb-foot');
      foot.textContent = 'Ranked by score, then by completion time. Analysts who opted out are counted in the totals but not listed. Refreshes about once a minute.';
      panel.appendChild(foot);
    }

    // Which cases the group gets wrong most often
    const cs = (d.caseStats || []).filter(c=>c.attempts > 0).slice(0,6);
    if(cs.length){
      const h2 = el('h2'); h2.style.marginTop = '24px';
      h2.textContent = 'MOST-MISSED CASES';
      panel.appendChild(h2);
      const t2 = el('table','lb');
      const th2 = document.createElement('thead');
      const hr2 = document.createElement('tr');
      ['Alert','Case','Correct','Attempts'].forEach(t=>{
        const th = document.createElement('th'); th.textContent = t; hr2.appendChild(th);
      });
      th2.appendChild(hr2); t2.appendChild(th2);
      const tb2 = document.createElement('tbody');
      cs.forEach(c=>{
        const tr = document.createElement('tr');
        const a = document.createElement('td'); a.className='num'; a.textContent = c.id;
        const b = document.createElement('td'); b.textContent = c.title;
        const cc = document.createElement('td');
        const bar = el('div','bar'); if(c.percent < 60) bar.classList.add('hard');
        const fill = document.createElement('span'); fill.style.width = Math.max(2,c.percent) + '%';
        bar.appendChild(fill);
        const pct = el('span'); pct.style.fontSize='11.5px'; pct.style.color='var(--muted)';
        pct.textContent = ' ' + c.percent + '%';
        cc.appendChild(bar); cc.appendChild(pct);
        const dd = document.createElement('td'); dd.className='num'; dd.textContent = c.attempts;
        [a,b,cc,dd].forEach(x=>tr.appendChild(x));
        tb2.appendChild(tr);
      });
      t2.appendChild(tb2);
      panel.appendChild(t2);
    }
  }

  const btnrow = el('div','btnrow');
  const left = el('div','left-group');
  const backBtn = el('button');
  backBtn.textContent = cameFrom === 'summary' ? '\u2190 Back to my results' : '\u2190 Back to sign-in';
  backBtn.addEventListener('click', ()=>{
    document.getElementById('leaderboardView').style.display = 'none';
    if(cameFrom === 'summary'){ renderSummary(); }
    else { renderRegister(); }
  });
  left.appendChild(backBtn);
  const refreshBtn = el('button'); refreshBtn.textContent = 'Refresh';
  refreshBtn.addEventListener('click', ()=> loadLeaderboard(true));
  left.appendChild(refreshBtn);
  btnrow.appendChild(left);
  btnrow.appendChild(el('div','right-group'));
  panel.appendChild(btnrow);

  view.appendChild(panel);
}

function render(){
  if(!participant){ renderRegister(); return; }
  document.getElementById('registerView').style.display = 'none';
  document.getElementById('leaderboardView').style.display = 'none';
  document.getElementById('topHeader').style.display = 'block';
  renderWhoami();
  if(idx >= SCENARIOS.length){ renderSummary(); return; }
  renderScenario();
  persist();
}

restore();
render();
